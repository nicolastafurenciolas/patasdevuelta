[build]
  publish = "."

# Las vistas previas de WhatsApp / Instagram / X pasan por esta función,
# que inyecta la foto y el nombre de la mascota en las etiquetas Open Graph.
[[edge_functions]]
  path = "/m/*"
  function = "ficha-og"

# Todo lo demás lo resuelve la aplicación en el navegador.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
